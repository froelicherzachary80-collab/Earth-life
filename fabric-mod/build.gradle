// EarthLife Fabric mod for Minecraft Java 26.3 (unobfuscated, so no mappings). Built by GitHub Actions
// (.github/workflows/mod-build.yml); locally: gradle :fabric-mod:build -> build/libs/earthlife-0.5.0.jar
//
// In-game tests: gradle :fabric-mod:runClientGameTest runs src/gametest in a real client (see STATUS.md).
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'earthlife'
base { archivesName = 'earthlife' }

loom { accessWidenerPath = file('src/main/resources/earthlife.accesswidener') }

repositories { mavenCentral() }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "earthlife-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
    }
}

loom {
    runs {
        clientGameTest {
            vmArg "-Dearthlife.offline=true"
            vmArg "-Xmx4G"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Engine-independent core (geo, tiles, economy, aviation) - tested separately with build.sh.
    implementation project(':core')
    include project(':core')
}

tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '5000'] }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
