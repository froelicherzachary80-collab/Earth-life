// ZMF Cinema - standalone Fabric mod for Minecraft Java 26.3 (no EarthLife needed).
// Built by GitHub Actions (.github/workflows/zmf-cinema.yml); locally: gradle :zmf-cinema-mod:build -> build/libs/zmfcinema-<version>.jar
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.zmf_version
group = 'zmf.cinema'
base { archivesName = 'zmfcinema' }

repositories { mavenCentral() }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "zmfcinema-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
    }
}

loom { runs { clientGameTest { vmArg "-Xmx4G" } } }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '5000'] }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
